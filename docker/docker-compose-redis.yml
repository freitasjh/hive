version: '3.8'

# Mesmo motivo do `docker-compose-vetor.yml`: sem `name`, o projeto compose chama-se `docker` (nome do
# diretório) e compartilha namespace com o outro clone do hive, com o taskflow e com o atlas-ecm.
name: hive

services:
  redis:
    image: redis:7.2-alpine
    container_name: hive-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - hive-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: hive-redis-insight
    restart: always
    ports:
      - "5540:5540"
    networks:
      - hive-network
    depends_on:
      - redis

networks:
  hive-network:
    driver: bridge

volumes:
  redis_data:
    # Mesmo motivo do postgres: fixar o nome evita que a troca de nome do projeto crie um volume vazio
    # e pareça "perda de dado". Ver `docker-compose-vetor.yml`.
    name: docker_redis_data
    driver: local
