version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: hive-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - hive-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: hive-redis-insight
    restart: always
    ports:
      - "5540:5540"
    networks:
      - hive-network
    depends_on:
      - redis

networks:
  hive-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
