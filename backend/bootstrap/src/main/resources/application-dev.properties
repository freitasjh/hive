### CONFIGURATION SERVER ###
server.port=8080

####### DATABASE CONFIGURATION ########
# Host 5433 = o que `docker/docker-compose-vetor.yml` publica. A 5432 do host pertence a outro
# projeto, e o perfil dev apontando para lá abria uma sessão no banco alheio sem nenhum erro visível:
# o boot conectava, o Flyway rodava, e o schema do Hive nascia no banco de outro projeto sem erro.
# Usuário/senha são os que o volume `postgres_data` realmente tem — o Postgres só aplica
# POSTGRES_USER/POSTGRES_PASSWORD na primeira inicialização de um diretório vazio.
spring.datasource.url=jdbc:postgresql://localhost:5432/hive
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARI
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.test.database.replace=none

# KB UPLOAD (R11-R13)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

##### JWT TOKEN #####
api.security.token.secret=123456
api.security.public.token.secret=hive-public-dev-secret-change-me

# Chave mestra de CIFRAGEM das credenciais de provider (AES-256-GCM), 32 bytes base64.
# ATENÇÃO: valor de DESENVOLVIMENTO. Trocar esta chave torna as credenciais já gravadas
# IRECUPERÁVEIS — será preciso re-cadastrar as chaves dos providers.
# Produção NUNCA deve usar este valor: defina PROVIDER_MASTER_KEY no ambiente.
provider.master.key=myiU2GAGC3aSZkUgtybiGenOQ1gMSQIcfcwDyW/onTM=

# Chave mestra de CIFRAGEM do segredo MFA (AES-256-GCM), 32 bytes base64. CHAVE DEDICADA:
# NAO e provider.master.key e nunca deve ser reutilizada para outra finalidade.
# ATENCAO: valor de DESENVOLVIMENTO. Trocar esta chave torna os segredos MFA ja gravados
# IRECUPERAVEIS (AES-GCM nao tem recuperacao). Producao NUNCA deve usar este valor:
# application-prod.properties nao declara esta propriedade — defina MFA_MASTER_KEY no ambiente;
# sem ela, o boot falha (fail-closed). Gere uma chave com: openssl rand -base64 32
mfa.master.key=aGl2ZS1kZXYtbWZhLW1hc3Rlci1rZXktMzJieXRlISE=

##### REDIS CONFIGURATION #####
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=  # Deixe comentado se não houver senha no docker-compose
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
