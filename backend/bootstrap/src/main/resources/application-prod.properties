#### CONFIGURATION SERVER ###
server.port=8080

####### DATABASE CONFIGURATION ########
spring.datasource.url=jdbc:postgresql://${DB_URL}:5432/hive
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARI
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.test.database.replace=none

# PREPARED STATEMENT CACHE
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# HIBERNATE BATCH
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# KB UPLOAD (R11-R13)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

##### JWT TOKEN #####
api.security.token.secret=${JWT_TOKEN}

##### REDIS CONFIGURATION (PROD) #####
# Endereçamento via variáveis de ambiente para containers/Cloud
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:0}

# Segurança: Habilita SSL se o Redis estiver em Cloud (ex: AWS ElastiCache / Redis Cloud)
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Timeouts: Valores mais conservadores para rede de produção
spring.data.redis.timeout=5000ms
spring.data.redis.connect-timeout=2000ms

# Pool de Conexões (Lettuce): Configuração para alta concorrência
# Otimizado para as Virtual Threads do Java 25
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:32}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:16}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:8}
spring.data.redis.lettuce.pool.max-wait=2000ms

# Resiliência: Tenta reconectar em caso de falha de rede
spring.data.redis.lettuce.shutdown-timeout=100ms
