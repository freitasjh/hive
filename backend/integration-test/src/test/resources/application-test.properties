server.servlet.context-path=/hive

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.test.database.replace=none

# Bugfix IT: muitos contextos Spring no Postgres Testcontainers esgotavam max_connections (100).
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

api.security.token.secret=hive-integration-test-secret-change-me
api.security.public.token.secret=hive-public-integration-test-secret-change-me

# Chave mestra de cifragem (AES-256-GCM) do perfil de teste. Valor falso e exclusivo de teste.
# O MasterKeyDeclarativePathIT depende desta propriedade: valida o caminho declarativo
# (sem PROVIDER_MASTER_KEY no ambiente), que é o cenário do bug.
provider.master.key=aGl2ZS1pdC1tYXN0ZXIta2V5LTMyLWJ5dGVzLWV4YWM=

# Chave mestra MFA (AES-256-GCM), 32 bytes base64. Valor falso e exclusivo de teste.
# Distinta da chave de provider: MFA usa MFA_MASTER_KEY / mfa.master.key.
mfa.master.key=aGl2ZS1pdC1tZmEtbWFzdGVyLWtleS0zMmJ5dGUhIVg=

# Redis: sobrescrito por @DynamicPropertySource no WebIntegrationTest
spring.data.redis.timeout=2000ms
